<style>
/* Layout: one phone-width column. Countdown hero first, progress bar second, today's checklist third, tab bar pinned below. */
:root{
  --bg:#F8F3F3; --surface:#FFFFFF; --surface2:#F1E5E5; --ink:#2B0D10; --muted:#74585B; --line:#E5D4D4;
  --brand:#A30D12; --on-brand:#FFFFFF;
  --good:#0F7B58; --good-bg:#DDF2EA; --warn:#9A5206; --warn-bg:#FCEBD0; --crit:#B5322A; --crit-bg:#FBE0DD;
  --hero:#9B0A0F; --hero-ink:#FFFFFF; --hero-mute:#F6CACC; --hero-line:rgba(255,255,255,.09);
  --num-ok:#FFFFFF; --num-warn:#FFD36B; --num-crit:#FFB9A3;
  --s1:#B3141A; --s2:#C2410C; --s3:#0F7B58; --s4:#8B3FBF; --s5:#9A7410; --s6:#0E7490;
  --f-display:'Anek Bangla','Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
  --f-body:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16090A; --surface:#231113; --surface2:#33191C; --ink:#F8EDED; --muted:#C7A9AB; --line:#472A2D;
    --brand:#E5575D; --on-brand:#1A0506;
    --good:#4FD0A0; --good-bg:#12372D; --warn:#F5B75A; --warn-bg:#3B2B10; --crit:#FF8D80; --crit-bg:#4A1D1B;
    --hero:#8F0A10;
    --s1:#FF8A8F; --s2:#FF9F6B; --s3:#4FD0A0; --s4:#D0A0FF; --s5:#F0C860; --s6:#5FD0E8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16090A; --surface:#231113; --surface2:#33191C; --ink:#F8EDED; --muted:#C7A9AB; --line:#472A2D;
  --brand:#E5575D; --on-brand:#1A0506;
  --good:#4FD0A0; --good-bg:#12372D; --warn:#F5B75A; --warn-bg:#3B2B10; --crit:#FF8D80; --crit-bg:#4A1D1B;
  --hero:#8F0A10;
  --s1:#FF8A8F; --s2:#FF9F6B; --s3:#4FD0A0; --s4:#D0A0FF; --s5:#F0C860; --s6:#5FD0E8;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  padding-block:0 112px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
#app{max-width:480px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:46px;height:46px;border-radius:12px;display:block;flex:none}
.foot-credit{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:8px 0 0}
.foot-credit img{width:26px;height:26px;border-radius:7px}
.foot-credit a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;border-radius:12px;color:var(--brand);font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--surface)}
.days{display:flex;flex-wrap:wrap;gap:8px}
.days .chip{max-width:none;min-height:40px}
.top h1{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.2;margin:0}
.top .date{font-size:13px;color:var(--muted)}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.iconbtn.live{background:var(--brand);color:var(--on-brand);border-color:var(--brand);width:auto;padding:0 12px;font-variant-numeric:tabular-nums;font-weight:600;gap:6px;display:flex;align-items:center}
main{display:flex;flex-direction:column;gap:16px}
.h2{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0}
.sub{margin:0;color:var(--muted);font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hero{position:relative;background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:20px 20px 22px;overflow:hidden;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--hero-line) 31px,var(--hero-line) 32px)}
.hero::before{content:"";position:absolute;inset:0 auto 0 34px;width:2px;background:rgba(255,255,255,.22)}
.hero>*{position:relative}
.h-top{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--hero-mute);padding-left:22px}
.h-top b{color:var(--hero-ink);font-weight:600}
.h-label{margin-top:18px;padding-left:22px;font-size:17px;color:var(--hero-mute)}
.h-num{display:flex;align-items:baseline;gap:10px;padding-left:22px;color:var(--num-ok)}
.t-warn .h-num{color:var(--num-warn)} .t-crit .h-num{color:var(--num-crit)}
.h-num b{font-family:var(--f-display);font-weight:800;font-size:clamp(84px,26vw,116px);line-height:1.05;font-variant-numeric:tabular-nums}
.h-num span{font-family:var(--f-display);font-weight:700;font-size:28px}
.h-msg{padding-left:22px;font-size:15px;color:var(--hero-ink);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3{margin:0 0 4px;font-family:var(--f-display);font-weight:700;font-size:17px}
.pbar-wrap{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.pbar-wrap strong{font-family:var(--f-display);font-weight:800;font-size:22px}
.pbar{height:16px;border-radius:999px;background:var(--surface2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .5s ease}
.pbar.sm{height:8px}
.banner{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:14px;font-size:14px}
.banner.warn{background:var(--warn-bg);color:var(--warn)} .banner.crit{background:var(--crit-bg);color:var(--crit)}
.banner.info{background:var(--surface2);color:var(--ink)} .banner.good{background:var(--good-bg);color:var(--good)}
.banner .btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 18px;border-radius:14px;font-weight:600;background:var(--brand);color:var(--on-brand);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.danger{background:var(--crit-bg);color:var(--crit)}
.btn.block{width:100%}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.chk{width:44px;height:44px;display:grid;place-items:center;margin:-6px -8px -6px -8px}
.chk span{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;color:transparent;transition:background .15s}
.chk[aria-pressed="true"] span{background:var(--good);border-color:var(--good);color:#fff}
.row .nm{text-align:left;min-width:0;display:block;width:100%}
.row .nm b{display:block;font-weight:600;overflow-wrap:anywhere}
.row .nm small{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
.row.done .nm b{text-decoration:line-through;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.w3{background:var(--crit-bg);color:var(--crit)} .tag.w1{background:var(--good-bg);color:var(--good)}
.tag.miss{background:var(--warn-bg);color:var(--warn)} .tag.now{background:var(--brand);color:var(--on-brand)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 3.2em;gap:4px 10px;align-items:center;padding:6px 0}
.srow .l{display:flex;align-items:center;gap:8px;font-weight:500;min-width:0}
.srow .l span:last-child{overflow-wrap:anywhere}
.srow .pbar{grid-column:1 / -1}
.srow b{text-align:right;font-variant-numeric:tabular-nums}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.daycard{border-radius:16px;background:var(--surface);border:1px solid var(--line);padding:12px 14px}
.daycard.today{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.daycard.past{opacity:.78}
.daycard.rev{background:var(--surface2)}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px;flex-wrap:wrap}
.dayhead b{font-family:var(--f-display);font-weight:700}
.dayhead .tags{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;padding:40px 8px;display:flex;flex-direction:column;gap:14px;align-items:center}
.empty h2{margin:0;font-family:var(--f-display)}
.ring{display:grid;place-items:center;position:relative}
.ring .c{position:absolute;text-align:center;font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1.1}
.ring .c small{display:block;font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface2);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bars i{display:block;width:100%;max-width:30px;background:var(--brand);border-radius:6px 6px 2px 2px;min-height:3px;opacity:.9}
.bars div.zero i{background:var(--line)}
.bars div.td{color:var(--ink);font-weight:600}
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
#tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
#tabs button{min-height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;font-weight:500;color:var(--muted)}
#tabs button[aria-current="page"]{color:var(--brand);font-weight:700;background:var(--surface2)}
#layer .scrim{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:40}
#layer .sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:min(100%,480px);max-height:92%;overflow:auto;z-index:41;
  background:var(--surface);border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px}
#layer .sheet.full{top:0;max-height:none;border-radius:0;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:22px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:14px;font-weight:600}
.field small{color:var(--muted)}
input[type=text],input[type=date],select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
textarea{min-height:112px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:44px;border-radius:12px;border:1px solid var(--line);font-weight:600;background:var(--bg)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper output{min-width:5.5em;text-align:center;font-weight:700;font-size:18px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--surface2)}
.steps i.on{background:var(--brand)}
.err{color:var(--crit);font-size:14px;min-height:1.2em}
.subcard{border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.timer{font-family:var(--f-display);font-weight:800;font-size:76px;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
.foot{display:flex;gap:10px}
.foot .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:min(92vw,440px);text-align:center}
.kv{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- helpers & logic (pure) ---------- */
var BND='০১২৩৪৫৬৭৮৯';
var bn=function(s){return String(s).replace(/\d/g,function(d){return BND[d]})};
var MON=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
var WD=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
var WDS=['রবি','সোম','মঙ্গল','বুধ','বৃহ','শুক্র','শনি'];
var WN={1:'সহজ',2:'মাঝারি',3:'কঠিন'};
var MIN_PER_W=45;
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var today=function(){var n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())};
var dn=function(s){var p=s.split('-').map(Number);return Math.round(Date.UTC(p[0],p[1]-1,p[2])/864e5)};
var addD=function(s,n){return new Date((dn(s)+n)*864e5).toISOString().slice(0,10)};
var dow=function(s){return new Date(dn(s)*864e5).getUTCDay()};
var fmtDate=function(s){var p=s.split('-').map(Number);return bn(p[2])+' '+MON[p[1]-1]+' '+bn(p[0])};
var fmtShort=function(s){var p=s.split('-').map(Number);return bn(p[2])+' '+MON[p[1]-1]};

function topicsOf(ex){var out=[];ex.subjects.forEach(function(s,si){s.topics.forEach(function(t){out.push({t:t,s:s,si:si})})});return out}
function tmapOf(ex){var m=new Map();topicsOf(ex).forEach(function(x){m.set(x.t.id,x)});return m}
function stats(ex){var tw=0,dw=0,tc=0,dc=0;topicsOf(ex).forEach(function(x){tw+=x.t.w;tc++;if(x.t.done){dw+=x.t.w;dc++}});return{pct:tw?Math.round(dw/tw*100):0,dc:dc,tc:tc,tw:tw,dw:dw}}

function offsOf(ex){return ex.dayOffs||(ex.dayOff>=0?[ex.dayOff]:[])}
function generate(ex){
  var t0=today(), tm=tmapOf(ex);
  var isDone=function(it){return it.rev?!!it.done:!!(tm.get(it.tid)&&tm.get(it.tid).t.done)};
  var old=ex.plan||[];
  var past=old.filter(function(d){return d.date<t0});
  past.forEach(function(d){d.items.forEach(function(it){if(!it.rev&&!isDone(it))it.missed=true})});
  var todayOld=old.find(function(d){return d.date===t0});
  var keepToday=(todayOld?todayOld.items:[]).filter(function(it){return !it.rev&&tm.get(it.tid)&&tm.get(it.tid).t.done});
  var D=dn(ex.date)-dn(t0);
  var days=[]; ex.load=0;
  if(D>0){
    var R=D<3?D:(D<5?1:Math.min(7,Math.max(1,Math.round(0.15*D))));
    for(var i=0;i<D;i++){
      var date=addD(t0,i), rev=i>=D-R;
      days.push({date:date,type:rev?'rev':(offsOf(ex).indexOf(dow(date))>=0||(ex.holidays||[]).indexOf(date)>=0?'off':'study'),items:[],load:0});
    }
    var study=days.filter(function(d){return d.type==='study'});
    if(!study.length)study=days.filter(function(d){return d.type!=='rev'});
    if(!study.length)study=days.slice();
    study.forEach(function(d){if(d.type==='off')d.type='study'});
    var qs=ex.subjects.map(function(s){return s.topics.filter(function(t){return !t.done})});
    var order=[],more=true;
    while(more){more=false;qs.forEach(function(q){if(q.length){order.push(q.shift());more=true}})}
    var N=order.length;
    var ranked=order.map(function(t,i){return{t:t,k:i-(t.w===3?0.3*N:0)}}).sort(function(a,b){return a.k-b.k}).map(function(x){return x.t});
    var total=ranked.reduce(function(a,t){return a+t.w},0), S=study.length, L=total/S;
    var cum=0;
    ranked.forEach(function(t){
      var di=Math.min(S-1,Math.max(0,Math.floor((cum+t.w/2)/L)));
      study[di].items.push({tid:t.id});study[di].load+=t.w;cum+=t.w;
    });
    ex.load=L;
    var revs=days.filter(function(d){return d.type==='rev'&&study.indexOf(d)<0});
    if(revs.length){
      if(revs.length>=2)revs[revs.length-1].light=true;
      var targets=revs.filter(function(d){return !d.light});
      var pool=topicsOf(ex).map(function(x){return x.t}).filter(function(t){return t.w>=2||t.note}).sort(function(a,b){return b.w-a.w}).slice(0,targets.length*5);
      pool.forEach(function(t,i){targets[i%targets.length].items.push({tid:t.id,rev:true})});
    }
    if(keepToday.length){days[0].items=keepToday.concat(days[0].items)}
  }
  ex.needH=ex.load*MIN_PER_W/60;
  ex.plan=past.concat(days);
  return ex;
}
function topicDone(ex,tid){var x=tmapOf(ex).get(tid);return !!(x&&x.t.done)}
function needsFix(ex){
  if(!ex.plan)return 'new';
  var t0=today();
  var miss=ex.plan.some(function(d){return d.date<t0&&d.items.some(function(it){return !it.rev&&!it.missed&&!topicDone(ex,it.tid)})});
  if(miss)return 'missed';
  if(dn(ex.date)>dn(t0)&&!ex.plan.some(function(d){return d.date===t0}))return 'gap';
  return '';
}
function seedExam(){
  var t0=today();
  var mk=function(n,w,done){return{id:uid(),name:n,w:w,done:!!done,doneAt:done?addD(t0,-done):null,note:''}};
  var ex={id:uid(),name:'এইচএসসি মডেল টেস্ট',date:addD(t0,19),hours:4,dayOffs:[5],holidays:[],created:t0,sample:true,sv:2,subjects:[
    {id:uid(),name:'পদার্থবিজ্ঞান',topics:[mk('নিউটনের গতিসূত্র',3),mk('কাজ, ক্ষমতা ও শক্তি',2),mk('মহাকর্ষ ও অভিকর্ষ',2),mk('পদার্থের গাঠনিক ধর্ম',2),mk('পর্যায়বৃত্ত গতি',3)]},
    {id:uid(),name:'গণিত',topics:[mk('সেট ও ফাংশন',1),mk('ত্রিকোণমিতি',3),mk('অন্তরীকরণ',3),mk('যোগজীকরণ',3),mk('সরলরেখা',2)]},
    {id:uid(),name:'রসায়ন',topics:[mk('পরমাণুর গঠন',2),mk('রাসায়নিক বন্ধন',3),mk('মৌলের পর্যায়বৃত্ত ধর্ম',2),mk('জারণ-বিজারণ',2)]},
    {id:uid(),name:'ইংরেজি',topics:[mk('Reading Comprehension',1),mk('Writing Skills',2),mk('Grammar: Tense ও Voice',2)]}
  ]};
  generate(ex);return ex;
}
function leftInfo(ex){
  var d=dn(ex.date)-dn(today());
  var tone=d<=3?'t-crit':(d<=7?'t-warn':'');
  var msg=d<0?'পরীক্ষা শেষ হয়েছে।':d===0?'আজই পরীক্ষা। শুভকামনা!':d===1?'আগামীকাল পরীক্ষা, হালকা রিভিশন করুন।':'';
  return{d:d,tone:tone,msg:msg};
}
function streakOf(S){
  var set={};S.exams.forEach(function(ex){topicsOf(ex).forEach(function(x){if(x.t.doneAt)set[x.t.doneAt]=1})});
  var d=today();if(!set[d])d=addD(d,-1);var n=0;while(set[d]){n++;d=addD(d,-1)}return n;
}

function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function checkMissed(){
  var fixed=0;
  S.exams.forEach(function(ex){var r=needsFix(ex);if(r){generate(ex);if(r==='missed')fixed++}});
  if(fixed){save();setTimeout(function(){toast('কিছু টপিক বাকি ছিল। রুটিন নতুন করে সাজানো হয়েছে।')},400)}
}
function migrate(){
  var changed=false;
  S.exams.forEach(function(ex){if(!ex.dayOffs){ex.dayOffs=offsOf(ex).slice();changed=true}if(!ex.holidays){ex.holidays=[];changed=true}});
  var old=S.exams.some(function(e){return e.sample});
  if(old){
    S.exams=S.exams.filter(function(e){return !e.sample});
    if(!S.exams.length){S.active=null;S.focus={}}
    else if(!S.exams.some(function(e){return e.id===S.active}))S.active=S.exams[0].id;
    changed=true;
  }
  if(changed){S.exams.forEach(function(e){generate(e)});save()}
}
function cur(){return S.exams.find(function(e){return e.id===S.active})||S.exams[0]||null}

function parseTopics(text,w){
  return text.split(/\r?\n/).map(function(l){return l.trim().replace(/^([\d০-৯]+[.)]\s*|[-*•]\s+)/,'')}).filter(Boolean).map(function(l){
    var ww=w;if(/!$/.test(l)){ww=3;l=l.replace(/!+$/,'').trim()}else if(/~$/.test(l)){ww=1;l=l.replace(/~+$/,'').trim()}
    return{id:uid(),name:l,w:ww,done:false,doneAt:null,note:''};
  }).filter(function(t){return t.name});
}
function buildExam(){
  var subs=W.subs.map(function(s,i){return{id:uid(),name:(s.name||'').trim()||'বিষয় '+bn(i+1),topics:parseTopics(s.text,s.w)}}).filter(function(s){return s.topics.length});
  var ex={id:uid(),name:W.name.trim()||'আমার পরীক্ষা',date:W.date,hours:W.hours,dayOffs:W.dayOffs.slice(),holidays:W.holidays.slice(),created:today(),subjects:subs};
  return generate(ex);
}
function wSync(){
  if(!W)return;
  if(W.step===1){var a=$('#w-name'),b=$('#w-date');if(a)W.name=a.value;if(b)W.date=b.value}
  else if(W.step===2){W.subs.forEach(function(s,i){var a=$('#w-sn-'+i),b=$('#w-st-'+i),c=$('#w-sw-'+i);if(a)s.name=a.value;if(b)s.text=b.value;if(c)s.w=+c.value})}
}
function wErr(m){var e=$('#w-err');if(e)e.textContent=m}

/* ---------- timer ---------- */
function setMode(m){T.mode=m;T.dur=m==='focus'?1500:300;T.left=T.dur;T.run=false;clearInterval(T.iv)}
function beep(){try{var ac=T.ac;if(!ac)return;[0,0.32].forEach(function(o){var os=ac.createOscillator(),g=ac.createGain();os.frequency.value=880;g.gain.value=0.15;os.connect(g);g.connect(ac.destination);os.start(ac.currentTime+o);os.stop(ac.currentTime+o+0.22)})}catch(e){}}
function addFocus(mins){if(mins<=0)return;var d=today();S.focus[d]=(S.focus[d]||0)+mins;save()}
function tick(){
  if(!T.run)return;
  T.left=Math.max(0,Math.round((T.endAt-Date.now())/1000));
  var el=$('#tm');if(el)el.textContent=mmss(T.left);
  var fc=$('#fchip');if(fc)fc.textContent=mmss(T.left);
  if(T.left<=0){
    var wasFocus=T.mode==='focus';clearInterval(T.iv);T.run=false;beep();
    if(wasFocus){addFocus(Math.round(T.dur/60));toast('ফোকাস শেষ! ৫ মিনিট বিরতি নিন।');setMode('break')}
    else{toast('বিরতি শেষ। আবার শুরু করুন।');setMode('focus')}
    if(UI.layer&&UI.layer.k==='focus')renderLayer();render();
  }
}

/* ---------- actions ---------- */
var ACT={
  tab:function(b){UI.tab=b.dataset.tab;UI.confirm=null;render(true)},

    if(b.dataset.rev){var d=ex.plan.find(function(p){return p.date===b.dataset.date});var it=d&&d.items.find(function(i){return i.rev&&i.tid===tid});if(it)it.done=!it.done}

  },
  topic:function(b){openLayer({k:'topic',tid:b.dataset.tid})},

  tdone:function(){var ex=cur(),x=tmapOf(ex).get(UI.layer.tid);if(x){x.t.done=!x.t.done;x.t.doneAt=x.t.done?today():null;generate(ex);save();closeLayer()}},

  },
  focus:function(){openLayer({k:'focus'})},
  add:function(){UI.add=null;openLayer({k:'add'})},
  addw:function(b){UI.add.w=+b.dataset.w;renderLayer()},
  addsave:function(){

  },

  },

  wcreate:function(){
    var ex=buildExam();
    S.exams=S.exams.filter(function(e){return !e.sample});S.exams.push(ex);S.active=ex.id;
    UI.tab='home';save();closeLayer();toast('রুটিন তৈরি হয়েছে। শুভ পড়াশোনা!');
  },
  wday:function(b){wSync();var i=+b.dataset.d,k=W.dayOffs.indexOf(i);if(k>=0)W.dayOffs.splice(k,1);else W.dayOffs.push(i);renderLayer()},
  whol:function(){wSync();var v=$('#w-hdate').value;if(!v)return;if(dn(v)<dn(today())){toast('আজকের আগের তারিখ বাছা যাবে না।');return}if(W.holidays.indexOf(v)<0)W.holidays.push(v);renderLayer()},
  wholdel:function(b){wSync();W.holidays=W.holidays.filter(function(d){return d!==b.dataset.date});renderLayer()},
  sday:function(b){var ex=cur(),i=+b.dataset.d,k=ex.dayOffs.indexOf(i);if(k>=0)ex.dayOffs.splice(k,1);else ex.dayOffs.push(i);generate(ex);save();render()},
  shol:function(){var ex=cur(),v=$('#s-hdate').value;if(!v)return;if(dn(v)<dn(today())){toast('আজকের আগের তারিখ বাছা যাবে না।');return}if(ex.holidays.indexOf(v)<0)ex.holidays.push(v);generate(ex);save();render();toast('ছুটি যোগ হয়েছে।')},
  sholdel:function(b){var ex=cur();ex.holidays=ex.holidays.filter(function(d){return d!==b.dataset.date});generate(ex);save();render()},
  tmode:function(b){if(T.run)return;setMode(b.dataset.m);renderLayer()},
  tstart:function(){
    if(T.run){T.run=false;clearInterval(T.iv);renderLayer();render();return}
    try{T.ac=T.ac||new (window.AudioContext||window.webkitAudioContext)();if(T.ac.state==='suspended')T.ac.resume()}catch(e){}
    T.run=true;T.endAt=Date.now()+T.left*1000;clearInterval(T.iv);T.iv=setInterval(tick,500);renderLayer();render();
  },
  treset:function(){
    if(T.mode==='focus'&&T.left<T.dur){addFocus(Math.floor((T.dur-T.left)/60))}
    setMode(T.mode);renderLayer();render();
  }
};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var f=ACT[b.dataset.act];if(f)f(b,e);
});
document.addEventListener('change',function(e){
  var t=e.target,k=t.dataset&&t.dataset.chg;if(!k)return;
  var ex=cur();
  if(k==='asub'){UI.add.sub=t.value;renderLayer()}
  else if(k==='ftopic'){T.topic=t.value}
  else if(k==='tname'){var x=tmapOf(ex).get(UI.layer.tid);if(x&&t.value.trim()){x.t.name=t.value.trim();save();render()}}
});
document.addEventListener('input',function(e){
  var t=e.target;if(t.dataset&&t.dataset.chg==='tnote'){var ex=cur(),x=tmapOf(ex).get(UI.layer.tid);if(x){x.t.note=t.value;save()}}
});
document.addEventListener('visibilitychange',function(){if(!document.hidden){if(T.run)tick();if(S){var before=JSON.stringify(S.exams.map(function(e){return e.plan.length}));checkMissed();render()}}});

(function(){
  S=loadLocal();
  if(!S){S={v:1,exams:[],active:null,theme:'auto',focus:{}};}
  if(!S.focus)S.focus={};
  migrate();checkMissed();applyTheme();render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();
</script>
